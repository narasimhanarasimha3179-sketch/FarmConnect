version: '3.8'

services:
  farmconnect-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmconnect-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=FarmConnect_Production_Secure_Key_2026_AGRI_HQ
    volumes:
      - farmconnect-data:/app/backend/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  farmconnect-data:
    driver: local
